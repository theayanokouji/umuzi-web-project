<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>COVID-19 Early Outbreak Dashboard</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>COVID-19 Early Outbreak Dashboard</h1>
            <p class="subtitle">February – March 2020 · from the first cases outside China to the WHO pandemic declaration on 11 March 2020</p>
        </header>

        <main>
            <!-- Controls -->
            <section class="controls" aria-label="Dashboard controls">
                <div class="control">
                    <label for="countrySelector">Country</label>
                    <select id="countrySelector">
                        <option value="">Select a country</option>
                    </select>
                </div>
                <div class="control">
                    <label for="startDate">From</label>
                    <input type="date" id="startDate" disabled>
                </div>
                <div class="control">
                    <label for="endDate">To</label>
                    <input type="date" id="endDate" disabled>
                </div>
                <button id="resetRange" type="button">Reset date range</button>
            </section>

            <p id="message" class="message" hidden></p>
            <p id="asOf" class="as-of"></p>

            <!-- Key metric cards -->
            <section class="cards" aria-label="Key metrics">
                <div class="card confirmed">
                    <h3>Confirmed</h3>
                    <p id="confirmedValue">-</p>
                </div>
                <div class="card deaths">
                    <h3>Deaths</h3>
                    <p id="deathsValue">-</p>
                </div>
                <div class="card recovered">
                    <h3>Recovered</h3>
                    <p id="recoveredValue">-</p>
                </div>
                <div class="card active">
                    <h3>Active cases</h3>
                    <p id="activeValue">-</p>
                </div>
            </section>

            <!-- Charts -->
            <section class="charts" aria-label="Charts">
                <div class="chart-box">
                    <canvas id="lineChart"></canvas>
                </div>
                <div class="chart-box">
                    <canvas id="dailyChart"></canvas>
                </div>
            </section>
        </main>

        <footer>
            <p>Data: COVID-19 Data Repository by Johns Hopkins CSSE</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="script.js"></script>
    </body>
</html>
